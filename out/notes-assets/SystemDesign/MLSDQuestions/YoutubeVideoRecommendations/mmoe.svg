<svg xmlns="http://www.w3.org/2000/svg" width="860" height="520" viewBox="0 0 860 520" role="img">
  <style>
    text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#222}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .h1{font-size:17px;font-weight:700;fill:#151515}
    .sub{font-size:12.5px;fill:#6b6b6b}
    .ptitle{font-size:13.5px;font-weight:700;fill:#1a1a1a}
    .bl{font-size:11.5px;font-weight:600;fill:#3a3a3a}
    .bs{font-size:10.5px;fill:#6b6b6b}
    .item{font-size:11.5px;fill:#3a3a3a}
    .small{font-size:11px;fill:#6b6b6b}
  </style>
  <rect x="0.5" y="0.5" width="859" height="519" rx="10" fill="#fbfaf6" stroke="#e6e4dd"/>

  <text class="h1" x="28" y="36">Why MMoE instead of one shared trunk</text>
  <text class="sub" x="28" y="58">A good recommendation is not one number. The question is what happens when two of those numbers want opposite things.</text>

  <rect x="28" y="96" width="272" height="374" rx="9" fill="#ffffff" stroke="#e2e0d9"/>
  <rect x="324" y="96" width="508" height="374" rx="9" fill="#ffffff" stroke="#e2e0d9"/>

  <text class="ptitle" x="46" y="120">Shared bottom</text>
  <text class="ptitle" x="344" y="120">MMoE — multi-gate mixture of experts</text>

  <!-- ============ LEFT ============ -->
  <rect x="44" y="136" width="240" height="26" rx="5" fill="#eeece5" stroke="#d8d6ce"/>
  <text class="bl" x="164" y="154" text-anchor="middle">shared input features</text>
  <rect x="84" y="186" width="160" height="118" rx="7" fill="#e8f0fe" stroke="#a8c7f5"/>
  <text class="bl" x="164" y="238" text-anchor="middle">one shared MLP</text>
  <text class="bs" x="164" y="256" text-anchor="middle">every task, same weights</text>

  <rect x="44" y="344" width="72" height="38" rx="6" fill="#fdecea" stroke="#e8a49d"/>
  <text class="bs" x="80" y="368" text-anchor="middle" fill="#a5261c">E[watch]</text>
  <rect x="128" y="344" width="72" height="38" rx="6" fill="#e6f4ea" stroke="#a5d6b6"/>
  <text class="bs" x="164" y="368" text-anchor="middle" fill="#137333">P(like)</text>
  <rect x="212" y="344" width="72" height="38" rx="6" fill="#fef7e0" stroke="#e5cf94"/>
  <text class="bs" x="248" y="368" text-anchor="middle" fill="#8a5400">P(not int.)</text>

  <g stroke="#b8b6ad" stroke-width="1.4" fill="none">
    <path d="M164 162 v20" marker-end="url(#m)"/>
    <path d="M164 304 v10 h-84 v26" marker-end="url(#m)"/>
    <path d="M164 314 v26" marker-end="url(#m)"/>
    <path d="M164 314 h84 v26" marker-end="url(#m)"/>
  </g>

  <rect x="44" y="400" width="240" height="56" rx="7" fill="#fff7f6" stroke="#f3c9c4"/>
  <text class="small" x="56" y="420" fill="#a5261c">Every task pulls on the same weights.</text>
  <text class="small" x="56" y="436" fill="#a5261c">When two objectives disagree, one of</text>
  <text class="small" x="56" y="452" fill="#a5261c">them loses. That is negative transfer.</text>

  <!-- ============ RIGHT ============ -->
  <rect x="344" y="136" width="468" height="26" rx="5" fill="#eeece5" stroke="#d8d6ce"/>
  <text class="bl" x="578" y="154" text-anchor="middle">shared input features</text>

  <g fill="#e8f0fe" stroke="#a8c7f5">
    <rect x="344" y="186" width="104" height="46" rx="7"/>
    <rect x="464" y="186" width="104" height="46" rx="7"/>
    <rect x="584" y="186" width="104" height="46" rx="7"/>
    <rect x="704" y="186" width="104" height="46" rx="7"/>
  </g>
  <g class="bl" text-anchor="middle" fill="#1a4fa0">
    <text x="396" y="215">expert 1</text><text x="516" y="215">expert 2</text><text x="636" y="215">expert 3</text><text x="756" y="215">expert 4</text>
  </g>

  <g stroke="#b8b6ad" stroke-width="1.3" fill="none">
    <path d="M396 162 v18" marker-end="url(#m)"/><path d="M516 162 v18" marker-end="url(#m)"/>
    <path d="M636 162 v18" marker-end="url(#m)"/><path d="M756 162 v18" marker-end="url(#m)"/>
  </g>

  <!-- gate fans: stroke width encodes the gate's softmax weight on that expert -->
  <g fill="none" stroke="#d93025">
    <line x1="396" y1="232" x2="422" y2="268" stroke-width="3.4" opacity=".75"/>
    <line x1="516" y1="232" x2="422" y2="268" stroke-width="2.3" opacity=".6"/>
    <line x1="636" y1="232" x2="422" y2="268" stroke-width="1.3" opacity=".38"/>
    <line x1="756" y1="232" x2="422" y2="268" stroke-width="0.8" opacity=".22"/>
  </g>
  <g fill="none" stroke="#1e8e3e">
    <line x1="396" y1="232" x2="578" y2="268" stroke-width="1.6" opacity=".42"/>
    <line x1="516" y1="232" x2="578" y2="268" stroke-width="2.6" opacity=".65"/>
    <line x1="636" y1="232" x2="578" y2="268" stroke-width="2.3" opacity=".6"/>
    <line x1="756" y1="232" x2="578" y2="268" stroke-width="1.3" opacity=".38"/>
  </g>
  <g fill="none" stroke="#b06000">
    <line x1="396" y1="232" x2="734" y2="268" stroke-width="0.8" opacity=".22"/>
    <line x1="516" y1="232" x2="734" y2="268" stroke-width="1.1" opacity=".3"/>
    <line x1="636" y1="232" x2="734" y2="268" stroke-width="2.3" opacity=".6"/>
    <line x1="756" y1="232" x2="734" y2="268" stroke-width="3.6" opacity=".78"/>
  </g>

  <g fill="#f6edfd" stroke="#cfa6ea">
    <rect x="352" y="268" width="140" height="36" rx="6"/>
    <rect x="508" y="268" width="140" height="36" rx="6"/>
    <rect x="664" y="268" width="140" height="36" rx="6"/>
  </g>
  <g class="bs" text-anchor="middle" fill="#6a2fa0">
    <text x="422" y="291">gate: watch time</text>
    <text x="578" y="291">gate: like</text>
    <text x="734" y="291">gate: not interested</text>
  </g>

  <g stroke="#b8b6ad" stroke-width="1.4" fill="none">
    <path d="M422 304 v34" marker-end="url(#m)"/><path d="M578 304 v34" marker-end="url(#m)"/><path d="M734 304 v34" marker-end="url(#m)"/>
  </g>
  <defs>
    <marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b8b6ad"/></marker>
  </defs>

  <rect x="352" y="344" width="140" height="38" rx="6" fill="#fdecea" stroke="#e8a49d"/>
  <text class="bl" x="422" y="368" text-anchor="middle" fill="#a5261c">E[watch time]</text>
  <rect x="508" y="344" width="140" height="38" rx="6" fill="#e6f4ea" stroke="#a5d6b6"/>
  <text class="bl" x="578" y="368" text-anchor="middle" fill="#137333">P(like), P(share)</text>
  <rect x="664" y="344" width="140" height="38" rx="6" fill="#fef7e0" stroke="#e5cf94"/>
  <text class="bl" x="734" y="368" text-anchor="middle" fill="#8a5400">P(not interested)</text>

  <text class="item" x="344" y="410">Line thickness = the gate's softmax weight on that expert.</text>
  <text class="item" x="344" y="428">Watch time leans on experts 1–2, “not interested” on 3–4: shared where</text>
  <text class="item" x="344" y="446">they agree, split where they fight — in <tspan font-weight="700">one forward pass</tspan>.</text>

  <text class="small" x="430" y="498" text-anchor="middle" font-style="italic">One model per task would also dodge the conflict — at N× the training, serving and on-call cost. MMoE is the version you can operate.</text>
</svg>
