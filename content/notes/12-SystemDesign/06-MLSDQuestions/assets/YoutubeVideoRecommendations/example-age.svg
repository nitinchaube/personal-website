<svg xmlns="http://www.w3.org/2000/svg" width="860" height="430" viewBox="0 0 860 430" role="img">
  <style>
    text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#222}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .h1{font-size:17px;font-weight:700;fill:#151515}
    .sub{font-size:12.5px;fill:#6b6b6b}
    .item{font-size:11.5px;fill:#3a3a3a}
    .small{font-size:11px;fill:#6b6b6b}
    .ann{font-size:11.5px;font-weight:600}
  </style>
  <rect x="0.5" y="0.5" width="859" height="429" rx="10" fill="#fbfaf6" stroke="#e6e4dd"/>

  <text class="h1" x="28" y="36">The “example age” trick, in one picture</text>
  <text class="sub" x="28" y="58">Every model trained on logged data is quietly biased towards old videos. This is a one-feature fix for it.</text>

  <!-- axes -->
  <line x1="80" y1="300" x2="806" y2="300" stroke="#b8b6ad" stroke-width="1.3"/>
  <line x1="80" y1="100" x2="80" y2="300" stroke="#b8b6ad" stroke-width="1.3"/>
  <g class="small" fill="#8a8a80" text-anchor="middle">
    <text x="80" y="318">0</text><text x="200" y="318">5</text><text x="320" y="318">10</text>
    <text x="440" y="318">15</text><text x="560" y="318">20</text><text x="680" y="318">25</text><text x="800" y="318">30</text>
  </g>
  <text class="small" x="443" y="340" text-anchor="middle">how old the video was when that impression was logged  (days)</text>
  <text class="small" x="72" y="112" text-anchor="end" transform="rotate(-90 72 112)">engagement</text>

  <!-- flat prediction -->
  <line x1="80" y1="250" x2="800" y2="250" stroke="#8a8a80" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text class="ann" x="800" y="242" text-anchor="end" fill="#5f6368">no age feature → one flat, time-averaged guess</text>

  <!-- real curve -->
  <path d="M80,215 C92,150 104,124 116,122 C180,132 300,236 480,272 C620,290 720,296 800,299"
        fill="none" stroke="#1a73e8" stroke-width="2.6"/>
  <text class="ann" x="230" y="150" fill="#1a4fa0">what engagement really does with age</text>

  <!-- the gap -->
  <line x1="150" y1="130" x2="150" y2="250" stroke="#d93025" stroke-width="1.6" marker-start="url(#u)" marker-end="url(#dn)"/>
  <text class="ann" x="160" y="196" fill="#a5261c">the gap the model eats</text>
  <text class="small" x="160" y="212" fill="#a5261c">every fresh upload is under-predicted</text>
  <defs>
    <marker id="u" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto"><path d="M4,0 L8,8 L0,8 z" fill="#d93025"/></marker>
    <marker id="dn" markerWidth="8" markerHeight="8" refX="4" refY="1" orient="auto"><path d="M4,8 L0,0 L8,0 z" fill="#d93025"/></marker>
  </defs>

  <circle cx="116" cy="122" r="5" fill="#1a73e8"/>
  <line x1="80" y1="100" x2="80" y2="308" stroke="#1e8e3e" stroke-width="1.6" stroke-dasharray="5 3"/>
  <rect x="88" y="86" width="196" height="24" rx="5" fill="#e6f4ea" stroke="#a5d6b6"/>
  <text class="small mono" x="98" y="102" fill="#137333">at serving:  example_age := 0</text>

  <line x1="28" y1="364" x2="832" y2="364" stroke="#ecebe4"/>
  <text class="item" x="28" y="388">Nothing in the feature vector says <tspan font-style="italic">when</tspan> an impression happened, so the model reads “old” as “good” — old videos simply had longer to</text>
  <text class="item" x="28" y="408">collect watches. Give it the age and it has somewhere else to put that effect. Then pin the feature to zero and ask: how good would this be if it were new?</text>
</svg>
