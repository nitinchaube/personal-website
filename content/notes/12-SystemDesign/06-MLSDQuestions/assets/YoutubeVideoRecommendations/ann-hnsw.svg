<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" role="img">
  <style>
    text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#222}
    .h1{font-size:17px;font-weight:700;fill:#151515}
    .sub{font-size:12.5px;fill:#6b6b6b}
    .lay{font-size:11.5px;font-weight:700;fill:#5f6368}
    .laysub{font-size:10.5px;fill:#8a8a80}
    .item{font-size:11.5px;fill:#3a3a3a}
    .small{font-size:11px;fill:#6b6b6b}
    .tag{font-size:10.5px;font-weight:600}
  </style>
  <rect x="0.5" y="0.5" width="859" height="399" rx="10" fill="#fbfaf6" stroke="#e6e4dd"/>

  <text class="h1" x="28" y="36">HNSW: a skip list, but in embedding space</text>
  <text class="sub" x="28" y="58">One greedy rule: hop to whichever neighbour is closer to u; when none is closer, drop a layer and refine.</text>

  <!-- slabs -->
  <rect x="120" y="84" width="700" height="66" rx="8" fill="#ffffff" stroke="#e2e0d9"/>
  <rect x="120" y="174" width="700" height="66" rx="8" fill="#ffffff" stroke="#e2e0d9"/>
  <rect x="120" y="264" width="700" height="66" rx="8" fill="#ffffff" stroke="#e2e0d9"/>

  <text class="lay" x="110" y="112" text-anchor="end">Layer 2</text>
  <text class="laysub" x="110" y="128" text-anchor="end">~0.01% of nodes</text>
  <text class="lay" x="110" y="202" text-anchor="end">Layer 1</text>
  <text class="laysub" x="110" y="218" text-anchor="end">~1% of nodes</text>
  <text class="lay" x="110" y="292" text-anchor="end">Layer 0</text>
  <text class="laysub" x="110" y="308" text-anchor="end">every video</text>

  <!-- layer 2 edges -->
  <g stroke="#d5d3cb" stroke-width="1.4">
    <line x1="170" y1="117" x2="410" y2="117"/><line x1="410" y1="117" x2="650" y2="117"/>
  </g>
  <!-- layer 1 edges -->
  <g stroke="#d5d3cb" stroke-width="1.4">
    <line x1="170" y1="207" x2="290" y2="207"/><line x1="290" y1="207" x2="410" y2="207"/>
    <line x1="410" y1="207" x2="530" y2="207"/><line x1="530" y1="207" x2="650" y2="207"/><line x1="650" y1="207" x2="770" y2="207"/>
    <path d="M170 207 q120 -26 240 0" fill="none"/><path d="M530 207 q120 -26 240 0" fill="none"/>
  </g>
  <!-- layer 0 edges -->
  <g stroke="#d5d3cb" stroke-width="1.4">
    <line x1="170" y1="297" x2="230" y2="297"/><line x1="230" y1="297" x2="290" y2="297"/><line x1="290" y1="297" x2="350" y2="297"/>
    <line x1="350" y1="297" x2="410" y2="297"/><line x1="410" y1="297" x2="470" y2="297"/><line x1="470" y1="297" x2="530" y2="297"/>
    <line x1="530" y1="297" x2="590" y2="297"/><line x1="590" y1="297" x2="650" y2="297"/><line x1="650" y1="297" x2="710" y2="297"/>
    <line x1="710" y1="297" x2="770" y2="297"/>
    <path d="M230 297 q60 -22 120 0" fill="none"/><path d="M470 297 q60 -22 120 0" fill="none"/><path d="M650 297 q60 -22 120 0" fill="none"/>
  </g>

  <!-- traversal path highlight -->
  <g stroke="#1a73e8" stroke-width="2.6" fill="none">
    <line x1="170" y1="117" x2="410" y2="117"/>
    <line x1="410" y1="207" x2="530" y2="207"/><line x1="530" y1="207" x2="650" y2="207"/>
    <line x1="650" y1="297" x2="710" y2="297"/>
  </g>
  <!-- drop arrows -->
  <g stroke="#d93025" stroke-width="1.8" stroke-dasharray="4 3" fill="none">
    <line x1="410" y1="127" x2="410" y2="196" marker-end="url(#d)"/>
    <line x1="650" y1="217" x2="650" y2="286" marker-end="url(#d)"/>
  </g>
  <defs>
    <marker id="d" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d93025"/></marker>
  </defs>

  <!-- nodes -->
  <g fill="#ffffff" stroke="#9a988f" stroke-width="1.4">
    <circle cx="170" cy="117" r="8"/><circle cx="410" cy="117" r="8"/><circle cx="650" cy="117" r="8"/>
    <circle cx="170" cy="207" r="8"/><circle cx="290" cy="207" r="8"/><circle cx="410" cy="207" r="8"/><circle cx="530" cy="207" r="8"/><circle cx="650" cy="207" r="8"/><circle cx="770" cy="207" r="8"/>
    <circle cx="170" cy="297" r="8"/><circle cx="230" cy="297" r="8"/><circle cx="290" cy="297" r="8"/><circle cx="350" cy="297" r="8"/><circle cx="410" cy="297" r="8"/><circle cx="470" cy="297" r="8"/><circle cx="530" cy="297" r="8"/><circle cx="590" cy="297" r="8"/><circle cx="650" cy="297" r="8"/><circle cx="710" cy="297" r="8"/><circle cx="770" cy="297" r="8"/>
  </g>
  <g fill="#1a73e8" stroke="#1a73e8">
    <circle cx="170" cy="117" r="8"/><circle cx="410" cy="117" r="8"/>
    <circle cx="410" cy="207" r="8"/><circle cx="530" cy="207" r="8"/><circle cx="650" cy="207" r="8"/>
    <circle cx="650" cy="297" r="8"/>
  </g>
  <circle cx="710" cy="297" r="9.5" fill="#d93025" stroke="#d93025"/>
  <circle cx="710" cy="297" r="14" fill="none" stroke="#d93025" stroke-width="1.4"/>

  <text class="tag" x="170" y="98" text-anchor="middle" fill="#1a73e8">entry</text>
  <text class="tag" x="712" y="272" text-anchor="middle" fill="#a5261c">nearest neighbour</text>
  <text class="tag" x="424" y="168" fill="#a5261c">drop a layer</text>
  <text class="tag" x="664" y="258" fill="#a5261c">drop a layer</text>

  <text class="item" x="28" y="360">Long strides at the top, short ones at the bottom: ~log N hops instead of N comparisons. HNSW usually beats</text>
  <text class="item" x="28" y="380">IVF on recall at equal latency, but the graph sits in RAM uncompressed and is expensive to mutate — which is why a billion-item index still ends up quantised.</text>
</svg>
