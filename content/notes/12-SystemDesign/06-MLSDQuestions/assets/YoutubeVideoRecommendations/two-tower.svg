<svg xmlns="http://www.w3.org/2000/svg" width="860" height="580" viewBox="0 0 860 580" role="img">
  <style>
    text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#222}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .h1{font-size:17px;font-weight:700;fill:#151515}
    .sub{font-size:12.5px;fill:#6b6b6b}
    .panel{font-size:10.5px;font-weight:700;letter-spacing:.09em}
    .boxtitle{font-size:12.5px;font-weight:700;fill:#1a1a1a}
    .item{font-size:11.5px;fill:#3a3a3a}
    .small{font-size:11px;fill:#6b6b6b}
    .chip{font-size:14px;font-weight:600}
    .cap{font-size:12px;fill:#444;font-style:italic}
  </style>
  <rect x="0.5" y="0.5" width="859" height="579" rx="10" fill="#fbfaf6" stroke="#e6e4dd"/>

  <text class="h1" x="28" y="36">The two-tower retrieval model</text>
  <text class="sub" x="28" y="58">One tower for the user, one for the video, and a single dot product at the very end. The gap between them is load-bearing.</text>

  <rect x="28" y="78" width="390" height="352" rx="9" fill="#f2f7fe" stroke="#d7e5fb"/>
  <rect x="442" y="78" width="390" height="352" rx="9" fill="#f7f6f2" stroke="#e6e4dd"/>
  <text class="panel" x="46" y="102" fill="#1a73e8">ONLINE · ONCE PER REQUEST</text>
  <text class="panel" x="460" y="102" fill="#8a8a80">OFFLINE · BATCH, CONTINUOUSLY REFRESHED</text>

  <!-- feature boxes -->
  <rect x="68" y="116" width="310" height="92" rx="7" fill="#fff" stroke="#d7e5fb"/>
  <text class="boxtitle" x="84" y="136">User features</text>
  <text class="item" x="84" y="155">watch history as a sequence (last N videos)</text>
  <text class="item" x="84" y="172">search queries, subscriptions, topic affinity</text>
  <text class="item" x="84" y="189">geo · language · device · time of day</text>

  <rect x="482" y="116" width="310" height="92" rx="7" fill="#fff" stroke="#e6e4dd"/>
  <text class="boxtitle" x="498" y="136">Video features</text>
  <text class="item" x="498" y="155">title + description text embedding</text>
  <text class="item" x="498" y="172">thumbnail / frame + audio embeddings</text>
  <text class="item" x="498" y="189">channel · topic · language · duration</text>

  <!-- arrows to MLP -->
  <g stroke="#a9a79f" stroke-width="1.5" fill="none">
    <path d="M223 208 v18" marker-end="url(#a)"/>
    <path d="M637 208 v18" marker-end="url(#a)"/>
    <path d="M223 282 v18" marker-end="url(#a)"/>
    <path d="M637 282 v18" marker-end="url(#a)"/>
    <path d="M637 340 v14" marker-end="url(#a)"/>
  </g>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#a9a79f"/>
    </marker>
    <marker id="ab" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1a73e8"/>
    </marker>
  </defs>

  <!-- MLPs -->
  <rect x="128" y="226" width="190" height="56" rx="7" fill="#fff" stroke="#c8dcf9"/>
  <text class="boxtitle" x="223" y="248" text-anchor="middle">MLP  512 → 256 → 64</text>
  <text class="small" x="223" y="266" text-anchor="middle">ReLU, output L2-normalised</text>

  <rect x="542" y="226" width="190" height="56" rx="7" fill="#fff" stroke="#e0ded6"/>
  <text class="boxtitle" x="637" y="248" text-anchor="middle">MLP  512 → 256 → 64</text>
  <text class="small" x="637" y="266" text-anchor="middle">ReLU, output L2-normalised</text>

  <!-- vector chips -->
  <rect x="143" y="300" width="160" height="38" rx="19" fill="#e8f0fe" stroke="#1a73e8"/>
  <text class="chip mono" x="223" y="325" text-anchor="middle" fill="#1a4fa0">u ∈ ℝ⁶⁴</text>

  <rect x="557" y="300" width="160" height="38" rx="19" fill="#eeece5" stroke="#8a8a80"/>
  <text class="chip mono" x="637" y="325" text-anchor="middle" fill="#3a3a34">v ∈ ℝ⁶⁴</text>

  <text class="small" x="223" y="366" text-anchor="middle">~1–3 ms of the budget.</text>
  <text class="small" x="223" y="384" text-anchor="middle">One forward pass, one user.</text>
  <text class="small" x="223" y="402" text-anchor="middle">Nothing about any video is touched here.</text>

  <rect x="497" y="354" width="280" height="58" rx="7" fill="#fff" stroke="#e0ded6"/>
  <text class="boxtitle" x="637" y="376" text-anchor="middle">Embed all ~10⁹ videos → ANN index</text>
  <text class="small" x="637" y="396" text-anchor="middle">ScaNN · HNSW · IVF-PQ</text>

  <!-- convergence -->
  <g stroke="#1a73e8" stroke-width="1.8" fill="none">
    <path d="M223 430 v22 h190" marker-end="url(#ab)"/>
    <path d="M637 430 v22 h-190" marker-end="url(#ab)"/>
  </g>

  <rect x="28" y="474" width="804" height="62" rx="9" fill="#e8f0fe" stroke="#1a73e8"/>
  <text class="boxtitle" x="430" y="500" text-anchor="middle">ANN lookup:  return the ~1,000 videos with the largest  ⟨u, v⟩  —  approximately, in ~20 ms</text>
  <text class="small" x="430" y="521" text-anchor="middle" fill="#1a4fa0">An exact scan would be 10⁹ dot products per request. The index turns that into a few thousand.</text>

  <text class="cap" x="430" y="562" text-anchor="middle">The towers never look at each other until that dot product. That restriction is what makes the offline precompute legal.</text>
</svg>
